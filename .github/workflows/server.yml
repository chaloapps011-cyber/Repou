name: PROJECT ZERO APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare package
        run: cp Package.json package.json

      - name: Install dependencies
        run: npm install

      - name: Check server syntax
        run: node --check Secretaria/Server.js

      - name: Build web game
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Prepare app icon
        run: |
          mkdir -p assets
          cp "Assets/23 Sem Título_20261031183014.png" assets/icon.png

      - name: Generate Android icons
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload PROJECT ZERO APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-ZERO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
