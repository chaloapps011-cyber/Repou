
name: PROJECT ZERO Build & Server Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-project:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare package
        run: cp Package.json package.json

      - name: Install dependencies
        run: npm install

      - name: Check server syntax
        run: node --check Secretaria/Server.js

      - name: Build PROJECT ZERO
        run: npm run build
